[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "talkhead-executor"
version = "0.1.0"
description = "Minimal stateful executor service for miner evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "loguru>=0.7.2",
  "bittensor",
  "substrate-interface",
  "numpy>=1.26",
  "opencv-python>=4.9",
  "opencv-python-headless>=4.9",
  "torch>=2.2",
  "torchaudio>=2.2",
  "torchcodec>=0.8.0",
  "insightface>=0.7.3",
  "onnxruntime>=1.18",
  "openai-whisper>=20231117",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
executor-service = "executor.app:run"

[tool.setuptools.packages.find]
where = ["."]
